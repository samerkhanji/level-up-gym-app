<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#e7e9e2; font-family:'Instrument Sans',sans-serif; color:#17211c; }
  a { color:#1e6b52; } a:hover { color:#124a38; }
</style>
</helmet>
<div style="width:1280px; margin:40px auto; background:#f3f4ef; border-radius:24px; box-shadow:0 24px 70px rgba(18,74,56,.16); box-sizing:border-box; padding:56px 60px;">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px;">
    <div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:52px; height:52px; border-radius:14px; background:#124a38; color:#dff0e6; display:grid; place-items:center; font-family:'Bricolage Grotesque'; font-weight:800; font-size:24px;">G</div>
        <div>
          <div style="font-family:'Bricolage Grotesque'; font-weight:800; font-size:36px; line-height:1;">GYM</div>
          <div style="color:#6c7a71; font-size:15px; margin-top:4px;">Your gym in one app — the phone is the membership.</div>
        </div>
      </div>
    </div>
    <div style="display:flex; gap:8px; font-size:12px; font-weight:700;">
      <span style="background:#dff0e6; color:#124a38; padding:6px 14px; border-radius:999px;">● Built &amp; live</span>
      <span style="background:#ffffff; color:#6c7a71; padding:6px 14px; border-radius:999px; border:1.5px dashed #c3d8cc;">○ Next</span>
    </div>
  </div>
  <div style="height:2px; background:#124a38; margin:20px 0 28px;"></div>
  <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
      <div style="background:#ffffff; border-radius:20px; padding:20px 22px; box-shadow:0 6px 18px rgba(23,33,28,.05); break-inside:avoid;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:30px; height:30px; border-radius:9px; background:{{ g.iconBg }}; color:{{ g.iconFg }}; display:grid; place-items:center; font-weight:800; font-size:12px;">{{ g.icon }}</div>
          <div style="font-family:'Bricolage Grotesque'; font-weight:700; font-size:17px;">{{ g.title }}</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:7px; margin-top:14px;">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
            <div style="display:flex; gap:9px; font-size:13px; line-height:1.45; color:{{ it.color }};">
              <span style="color:{{ it.dot }}; font-weight:800; flex-shrink:0;">{{ it.mark }}</span>
              <span>{{ it.text }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:20px; border-top:1px solid #d8dcd2;">
    <div style="font-size:13px; color:#6c7a71;">Live demo: <b style="color:#124a38;">gym-app.vercel.app</b> · installable PWA · 26-table data layer · auto-deploy on push</div>
    <div style="font-family:'Bricolage Grotesque'; font-weight:800; font-size:14px; color:#124a38;">The economy is closed — every tap feeds the business data.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const Y = t => ({ mark: "●", dot: "#1e6b52", color: "#17211c", text: t });
    const N = t => ({ mark: "○", dot: "#9aa79f", color: "#6c7a71", text: t });
    return { groups: [
      { icon: "AC", iconBg: "#124a38", iconFg: "#dff0e6", title: "Access & Security", items: [
        Y("Phone-as-key: QR pass regenerates every 25 s — screenshot-proof"),
        Y("Face ID / fingerprint before the pass shows"),
        Y("Anti-passback — pass flips to Scan-to-EXIT while inside"),
        Y("Denials with exact reason (frozen, expired) — every attempt logged"),
        Y("One registered phone per member · geofence checkout reminder"),
        Y("Reception override with typed reason, logged by staff name"),
        N("Server-verified HMAC tokens, real turnstile, NFC/BLE tap") ] },
      { icon: "TR", iconBg: "#124a38", iconFg: "#dff0e6", title: "Training", items: [
        Y("Workout program with sets × reps and last weights, one-tap logging"),
        Y("Personal records (+20 pts) · fitness assessments ($25)"),
        Y("Trainer profiles: ratings, languages, live availability"),
        Y("PT packages — sessions count only after member confirms"),
        Y("Classes with waitlists, cancellation window, no-show policy"),
        Y("Monthly challenge → auto-payout 500 pts") ] },
      { icon: "FC", iconBg: "#124a38", iconFg: "#dff0e6", title: "Facility", items: [
        Y("Smart lockers: auto-assigned, phone lock/unlock, auto-released"),
