<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GYM · Home — Heritage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F3EC; --card:#FFFDF8; --ink:#17251D; --muted:#5D6B60;
    --line:#E3DFD2; --line-strong:#CFC9B8; --green:#17493A; --green-press:#0F382C;
    --mint:#E4EEE4; --brass:#A3814F;
    --serif:'Fraunces', Georgia, serif; --sans:'Instrument Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);display:grid;place-items:center;min-height:100dvh;font-family:var(--sans);color:var(--ink);padding:24px}
  .phone{width:400px;background:var(--paper);border:1px solid var(--line-strong);border-radius:44px;padding:18px 22px 14px;box-shadow:0 24px 70px rgba(23,37,29,.14)}
  .screen{padding:48px 6px 8px;min-height:940px;display:flex;flex-direction:column}

  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .greet .day{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .greet h1{font-family:var(--serif);font-size:31px;font-weight:500;letter-spacing:-.015em;line-height:1.1;margin-top:3px}
  .greet .tier{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--brass);margin-top:6px}
  .bell{position:relative;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:15px}
  .bell i{position:absolute;top:-5px;right:-5px;background:var(--green);color:#F5F3EC;font-style:normal;font-size:10px;font-weight:600;width:17px;height:17px;border-radius:50%;display:grid;place-items:center}

  .rule{height:1px;background:var(--line);margin:16px 0}

  .enter{background:var(--green);color:#F5F3EC;border:none;border-radius:14px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%;transition:transform .18s ease, background .18s ease;font-family:var(--sans)}
  .enter:hover{background:var(--green-press)}
  .enter:active{transform:scale(.985)}
  .enter .t h2{font-family:var(--serif);font-size:22px;font-weight:500;text-align:left}
  .enter .t p{font-size:12.5px;color:#C9D8CE;margin-top:2px;text-align:left}
  .enter .arrow{font-family:var(--serif);font-size:24px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:14px}
  .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted);display:block;margin-bottom:8px}
  .now{display:flex;align-items:baseline;gap:12px}
  .now .n{font-family:var(--serif);font-size:56px;font-weight:400;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .now .d p{font-weight:600;font-size:14.5px}
  .now .d span{font-size:12.5px;color:var(--muted)}
  .bars{display:flex;gap:5px;align-items:flex-end;height:38px;margin-top:14px}
  .bars i{flex:1;background:#E7E3D6;border-radius:2px}
  .bars i.on{background:var(--green)}
  .bars-cap{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}

  .duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .duo .card{margin-top:0}
  .duo .v{font-family:var(--serif);font-size:31px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .duo .s{font-size:12px;color:var(--muted)}

  .challenge{display:flex;justify-content:space-between;align-items:center}
  .challenge .v{font-variant-numeric:tabular-nums;font-weight:600}
  .track{height:3px;background:#E7E3D6;border-radius:2px;margin-top:12px;overflow:hidden}
  .track i{display:block;height:100%;width:60%;background:var(--brass)}

  nav{margin-top:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  nav button{flex:1;background:none;border:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding:14px 0 12px;cursor:pointer;border-top:2px solid transparent}
  nav button.on{color:var(--green);border-top-color:var(--green)}
</style></head><body>

<div class="phone"><div class="screen">
  <header>
    <div class="greet">
      <span class="day">Wednesday · 30 July</span>
      <h1>Good morning, Samer</h1>
      <span class="tier">Performance · City Center</span>
    </div>
    <div class="bell"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17251D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Notifications"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><i>2</i></div>
  </header>

  <div class="rule"></div>

  <button class="enter">
    <span class="t">
      <h2>Enter the club</h2>
      <p>Open your pass for the gate</p>
    </span>
    <span class="arrow">→</span>
  </button>

  <div class="card">
    <span class="cap">Gym right now</span>
    <div class="now">
      <span class="n">37</span>
      <span class="d"><p>Quiet</p><span>members inside · capacity 120</span></span>
    </div>
    <div class="bars">
      <i style="height:30%"></i><i style="height:22%" class="on"></i><i style="height:18%"></i><i style="height:26%"></i><i style="height:42%"></i><i style="height:66%"></i><i style="height:88%"></i><i style="height:74%"></i><i style="height:52%"></i>
    </div>
    <div class="bars-cap"><span>6a</span><span>10a</span><span>2p</span><span>6p</span><span>10p</span></div>
  </div>

  <div class="duo">
    <div class="card"><span class="cap">Wallet</span><div class="v">$68.00</div><div class="s">tap to top up</div></div>
    <div class="card"><span class="cap">Points</span><div class="v">340</div><div class="s">120 to next reward</div></div>
  </div>

  <div class="card">
    <div class="challenge">
      <span class="cap" style="margin:0">30-day consistency</span>
      <span class="v">12 / 20</span>
    </div>
    <div class="track"><i></i></div>
  </div>

  <nav>
    <button class="on">Home</button>
    <button>Train</button>
    <button>Gym</button>
    <button>Food</button>
    <button>Account</button>
  </nav>
</div></div>

</body></html>
