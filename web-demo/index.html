<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Level Up — Member App</title>
<meta name="theme-color" content="#0b0d0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Level Up" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css?v=10" />
<style>
/* ---- Level Up OS member-app additions (page-local; styles.css is shared) ---- */

/* six equal-width nav columns — Home / Train / QR / Trainer / Club / Account, all
   contained inside one continuous bar, same baseline, same touch behavior. */
.tabbar { height: 74px; padding: 8px; align-items: stretch; }
.tabbar .tab { font-size: 10.5px; padding: 7px 0 5px; gap: 3px; min-height: 44px; }
.tabbar .tab svg { width: 22px; height: 22px; }

/* Scan to Enter — a normal nav column like the others, not a floating FAB.
   Emphasized via a small rounded-square icon chip with its own soft lift,
   so it reads as "the important one" without looking like an unrelated
   oversized button or a permanently-selected state. */
.scan-fab {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 7px 0 5px; border-radius: 19px; min-height: 44px;
  color: var(--muted); font-size: 10.5px; font-weight: 600;
  transition: background var(--dur-3) var(--ease-standard), color var(--dur-3) var(--ease-standard), transform var(--dur-2) var(--ease-spring);
}
.scan-fab .qr-ic {
  flex-shrink: 0; box-sizing: border-box;
  width: 28px; height: 28px; border-radius: var(--r-sm);
  background: var(--green); color: var(--green-deep);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(255, 255, 255, 0.16);
  transition: transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease-standard);
}
.scan-fab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scan-fab:active { transform: scale(0.95); }
.scan-fab:active .qr-ic { transform: scale(0.9); box-shadow: 0 1px 4px rgba(255, 255, 255, 0.12); }
.scan-fab.active { color: var(--green-deep); background: var(--mint); font-weight: 700; }
.scan-fab.hidden { display: none; }
@media (prefers-reduced-motion: reduce) {
  .scan-fab, .scan-fab .qr-ic { transition: none; }
  .scan-fab:active, .scan-fab:active .qr-ic { transform: none; }
}

/* ---- Home: header status pill (glanceable state next to the greeting) ---- */
.hm-pill {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--r-pill); padding: 6px 12px 6px 10px;
  font-size: var(--fs-caption); font-weight: 700; letter-spacing: 0.2px;
  background: var(--tint); color: var(--muted); flex-shrink: 0;
  border: 1px solid var(--line-soft);
}
.hm-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--faint); }
.hm-pill.ok { color: var(--ink); }
.hm-pill.ok .dot { background: var(--green); }
.hm-pill.live { color: var(--ink); }
.hm-pill.live .dot { background: var(--green); animation: pulse 2s infinite; }
.hm-pill.warn { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
.hm-pill.warn .dot { background: var(--amber); }

/* ---- Home: membership pass — the identity anchor of the screen ---- */
.hm-pass {
  position: relative; overflow: hidden;
  background:
    radial-gradient(220px 160px at 96% -25%, rgba(255,255,255,0.10) 0%, transparent 70%),
    linear-gradient(155deg, #232323 0%, #050505 75%);
  color: var(--ink); border-radius: var(--r-xl); padding: 22px;
  display: flex; flex-direction: column; gap: 18px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-float); flex-shrink: 0;
}
/* a faint diagonal sheen, like light catching a physical card — subtle, not glassy */
.hm-pass::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.05) 48%, transparent 56%);
}
.hm-pass-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hm-pass-brand { font-family: var(--display); font-weight: 800; font-size: 12.5px; letter-spacing: 3.5px; color: var(--faint); }
.hm-pass-chip { border-radius: var(--r-pill); padding: 4px 11px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.14); white-space: nowrap; }
.hm-pass-chip.bad { background: rgba(239,68,68,0.45); }
.hm-pass-chip.frz { background: rgba(245,158,11,0.45); }
.hm-pass-name { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.hm-pass-plan { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.hm-pass-stats { display: flex; flex-wrap: wrap; gap: 18px 22px; }
.hm-pass-stat { display: flex; flex-direction: column; gap: 3px; }
.hm-pass-stat b { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; line-height: 1; }
.hm-pass-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); padding-top: 2px; border-top: 1px solid var(--line-soft); }
.hm-pass-meta .sep { opacity: 0.6; }

/* ---- Home: unified live-status band (inside / blocked / gate-ready) ----
   One component instead of two stacked blocks — the same fact rendered one
   way, so it can't show a "frozen" hero AND a "blocked" banner at once. */
.hm-status {
  width: 100%; border: none; cursor: pointer; text-align: left;
  border-radius: var(--r-xl); padding: 18px 18px 18px 16px;
  display: flex; align-items: center; gap: 13px; flex-shrink: 0;
  transition: transform var(--dur-2) var(--ease-spring);
}
.hm-status:active { transform: scale(0.98); }
.hm-status-dot {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.hm-status-body { flex: 1; min-width: 0; }
.hm-status-title { font-family: var(--display); font-size: 16px; font-weight: 800; letter-spacing: -0.1px; }
.hm-status-meta { font-size: 12.5px; margin-top: 2px; opacity: 0.75; }
.hm-status-chev { flex-shrink: 0; opacity: 0.55; }

.hm-status-inside { background: var(--mint); color: var(--green-deep); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24); }
.hm-status-inside .hm-status-dot { background: rgba(11,13,15,0.12); }
.hm-status-inside .hm-status-dot .live-core { width: 12px; height: 12px; border-radius: 50%; background: var(--green-deep); animation: pulse 2s infinite; }

.hm-status-ready { background: var(--card); box-shadow: var(--shadow); }
.hm-status-ready .hm-status-dot { background: var(--tint); color: var(--green); }

.hm-status-blocked { background: var(--amber-soft); box-shadow: var(--shadow); }
.hm-status-blocked .hm-status-dot { background: rgba(255, 176, 32, 0.16); color: var(--amber); }
.hm-status-blocked .hm-status-title { color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  .hm-status { transition: none; }
  .hm-status:active { transform: none; }
  .hm-status-inside .live-core, .hm-pill.live .dot { animation: none; }
}

/* new tab containers get the same stagger the legacy ones have in styles.css */
#c-trainer, #c-club, #c-nutrition {
  display: flex; flex-direction: column; gap: 13px;
}
#c-trainer > *, #c-club > *, #c-nutrition > * {
  animation: rise 0.38s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
#c-trainer > *:nth-child(2), #c-club > *:nth-child(2), #c-nutrition > *:nth-child(2) { animation-delay: 0.05s; }
#c-trainer > *:nth-child(3), #c-club > *:nth-child(3), #c-nutrition > *:nth-child(3) { animation-delay: 0.1s; }
#c-trainer > *:nth-child(4), #c-club > *:nth-child(4), #c-nutrition > *:nth-child(4) { animation-delay: 0.15s; }
#c-trainer > *:nth-child(n+5), #c-club > *:nth-child(n+5), #c-nutrition > *:nth-child(n+5) { animation-delay: 0.2s; }

.login-hero { width: 100%; max-height: 150px; object-fit: cover; border-radius: 18px; margin-bottom: 4px; }

/* branch chip — appears on every class / session card so branches can't be confused */
.chip-branch {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1.5px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 2.5px 9px; font-size: 11px; font-weight: 700; color: var(--ink);
}
.chip-branch .dotc { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.chip-branch.tbc { color: var(--muted); border-style: dashed; }

/* occupancy bar */
.occ-track { height: 7px; border-radius: 4px; background: var(--tint); overflow: hidden; flex: 1; }
.occ-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--green-bright), var(--green)); transition: width 0.7s cubic-bezier(0.2, 0.7, 0.3, 1); }
.occ-fill.mid { background: linear-gradient(90deg, #c8952c, var(--amber)); }
.occ-fill.hot { background: linear-gradient(90deg, #d5654f, var(--red)); }

.bimg { width: 100%; height: 108px; object-fit: cover; border-radius: 14px; display: block; background: var(--tint); }
.class-thumb { width: 62px; height: 62px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--tint); }
.svc-thumb { width: 52px; height: 52px; border-radius: 13px; object-fit: cover; flex-shrink: 0; background: var(--tint); }

.zone-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.zone-strip::-webkit-scrollbar { display: none; }
.zone-cell { flex-shrink: 0; width: 74px; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.zone-cell img { width: 74px; height: 52px; object-fit: cover; border-radius: 10px; background: var(--tint); }
.zone-cell span { font-size: 9.5px; color: var(--muted); line-height: 1.25; }

/* slot / option chips used by PT booking, gate picker, filters */
.slot {
  border: 1.5px solid var(--line); background: var(--card); cursor: pointer;
  border-radius: 11px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink);
}
.slot.sel { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.slot:disabled { opacity: 0.35; cursor: default; }
.slot-row { display: flex; flex-wrap: wrap; gap: 7px; }

.gate-picker { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
.token-line { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10.5px; color: var(--muted); letter-spacing: 0.4px; }

.warn-banner {
  background: var(--amber-soft); border-radius: var(--r-md); padding: 12px 14px;
  display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink); flex-shrink: 0;
}
.warn-banner .ic { color: var(--amber); flex-shrink: 0; margin-top: 1px; }
.warn-banner b { display: block; }
.err-line { color: var(--red); font-size: 13px; font-weight: 600; line-height: 1.45; }

details.more-stub {
  background: var(--card); border-radius: var(--r-md); padding: 13px 15px;
  font-size: 13.5px; color: var(--muted); box-shadow: var(--shadow); flex-shrink: 0; line-height: 1.5;
}
details.more-stub summary { font-weight: 700; color: var(--ink); cursor: pointer; }
details.more-stub ul { padding-left: 17px; margin-top: 7px; display: flex; flex-direction: column; gap: 5px; }

/* ---- Train tab: workout tracking (Today / Workouts / Logger / History / My Trainer) ---- */

/* Today's flagship card — the single most-used surface in the app; answers
   "can a member start a workout in one tap" without any extra reading. */
.tr-hero {
  position: relative; overflow: hidden;
  background:
    radial-gradient(220px 160px at 96% -25%, rgba(255,255,255,0.10) 0%, transparent 70%),
    linear-gradient(155deg, #232323 0%, #050505 75%);
  border: 1px solid var(--line); border-radius: var(--r-xl);
  padding: 22px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--shadow-float); flex-shrink: 0;
}
.tr-hero-eyebrow { color: var(--faint); }
.tr-hero-eyebrow .ic { color: var(--ink); }
.tr-hero-title { font-family: var(--display); font-weight: 800; font-size: var(--fs-heading); letter-spacing: -0.2px; }
.tr-hero-meta { font-size: var(--fs-support); color: var(--muted); }
.tr-hero .accent-btn { margin-top: 6px; }

/* icon-chip stat tiles — same visual language as Home's quick actions,
   so "Streak" and "PT credits" read as the same kind of thing app-wide */
.tr-stat-row { display: flex; gap: var(--sp-3); flex-shrink: 0; }
.tr-stat {
  flex: 1; background: var(--card); box-shadow: var(--shadow); border-radius: var(--r-lg);
  padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0;
}
.tr-stat-ic { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--tint); color: var(--green); display: flex; align-items: center; justify-content: center; }
.tr-stat b { font-family: var(--display); font-size: var(--fs-stat); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.tr-stat span { font-size: var(--fs-caption); color: var(--muted); font-weight: 500; }

.mchip {
  display: inline-block; background: var(--tint); color: var(--muted);
  border-radius: 8px; padding: 2px 8px; font-size: 10.5px; font-weight: 600;
  margin: 0 4px 4px 0;
}

/* rest timer */
.rest-wrap { background: var(--card); border-radius: var(--r-md); padding: 13px 14px; box-shadow: var(--shadow); flex-shrink: 0; }
.rest-wrap.idle .rest-track { opacity: 0.4; }
.rest-info { font-weight: 700; font-size: 13.5px; margin-bottom: 7px; }
.rest-track { height: 7px; border-radius: 4px; background: var(--tint); overflow: hidden; }
.rest-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green-bright), var(--green)); transition: width 1s linear; }

/* per-set logging table */
.set-table { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.set-row { background: var(--tint); border-radius: 13px; padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }
.set-row.done { background: var(--mint); }
.set-row-top { display: flex; align-items: center; gap: 8px; }
.set-type {
  border: 1.5px solid var(--line); background: var(--card); border-radius: 9px;
  padding: 6px 5px; font-size: 11px; font-weight: 700; width: 62px; flex-shrink: 0; font-family: var(--body);
}
.set-meta { flex: 1; font-size: 11.5px; color: var(--muted); }
.set-log {
  background: var(--green); color: var(--green-deep); border: none; border-radius: 10px;
  padding: 8px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px;
}
.set-log.done { background: var(--mint); color: var(--green-deep); }
.set-row-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wt-group { display: flex; align-items: center; gap: 4px; }
.wt-adj {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 8px;
  width: 30px; height: 30px; font-size: 10.5px; font-weight: 700; cursor: pointer; flex-shrink: 0; color: var(--ink);
}
.set-inp { border: 1.5px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 6px; font-size: 13px; font-family: var(--body); text-align: center; color: var(--ink); }
.set-wt { width: 58px; }
.set-reps { width: 50px; }
.set-rpe { width: 52px; appearance: auto; }

/* finish-workout celebration — same pop/glow feel as the gate-entry success screen */
.finish-cele {
  position: absolute; inset: 0; z-index: 90; background: rgba(11, 13, 15, 0.98);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px;
  padding: 28px; text-align: center;
}
.fc-big { font-size: 58px; position: relative; animation: fcPop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.4) both; }
.fc-big::before {
  content: ''; position: absolute; inset: -32px; z-index: -1; border-radius: 50%;
  background: radial-gradient(circle, rgba(168, 100, 8, 0.25), transparent 70%);
  filter: blur(8px); opacity: 0; animation: fcGlow 0.9s ease 0.05s both;
}
@keyframes fcPop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes fcGlow { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }
.fc-title { font-family: var(--display); font-size: 24px; font-weight: 800; }
.fc-sub { color: var(--muted); font-size: 14.5px; }
.fc-stats { display: flex; gap: 20px; margin: 4px 0; }
.fc-stat { display: flex; flex-direction: column; align-items: center; }
.fc-stat b { font-family: var(--display); font-size: 21px; font-weight: 800; }
.fc-stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 2px; }
.finish-prs { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; }
.finish-pr-chip {
  background: var(--amber-soft); color: var(--amber); font-weight: 800; font-size: 13.5px;
  border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; justify-content: center;
  animation: fcChip 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.3) both;
}
.finish-prs .finish-pr-chip:nth-child(2) { animation-delay: 0.08s; }
.finish-prs .finish-pr-chip:nth-child(3) { animation-delay: 0.16s; }
@keyframes fcChip { 0% { transform: scale(0.7) translateY(6px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .fc-big, .fc-big::before, .finish-pr-chip { animation: none; }
  .rest-fill { transition: none; }
}
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="screen" id="screen">

        <!-- LOGIN -->
        <section class="view" id="view-login">
          <div class="login-wrap">
            <img class="login-hero" src="img/hero-login.svg" alt="" />
            <div class="logo"><svg viewBox="0 0 200 200" width="96" height="96" style="color:var(--ink);filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))" aria-label="Level Up — the journey never ends"><circle cx="100" cy="100" r="94" fill="none" stroke="currentColor" stroke-width="4"/><path id="luLt" d="M 27,110 A 74,74 0 0 1 173,110" fill="none"/><path id="luLb" d="M 173,112 A 74,74 0 0 1 27,112" fill="none"/><text font-family="Sora,sans-serif" font-weight="700" font-size="11.5" letter-spacing="1.8" fill="currentColor"><textPath href="#luLt" startOffset="50%" text-anchor="middle">THE JOURNEY NEVER ENDS</textPath></text><text font-family="Sora,sans-serif" font-weight="700" font-size="11.5" letter-spacing="1.8" fill="currentColor"><textPath href="#luLb" startOffset="50%" text-anchor="middle">LEVEL UP TRAINING GYM</textPath></text><text x="90" y="122" font-family="Sora,sans-serif" font-weight="800" font-size="56" fill="currentColor">L</text><text x="118" y="80" font-family="Sora,sans-serif" font-weight="800" font-size="20" fill="currentColor">+</text></svg></div>
            <div class="tagline">One membership. Every branch.</div>

            <div id="loginStep1">
              <input class="input" id="loginId" placeholder="Phone number or email" value="+961 70 123 456" autocomplete="off" inputmode="email" />
              <div id="loginError" class="dim small center" style="color:var(--red)" hidden></div>
              <button class="accent-btn" id="loginContinueBtn">Continue</button>
            </div>

            <div id="loginStep2" class="login-bio" hidden>
              <div class="faceid-ring"></div>
              <div class="light" id="loginBioLabel">Confirm it's you</div>
            </div>

            <div class="login-links">
              <button class="link-btn" id="activateBtn">Join Level Up</button>
              <button class="link-btn" id="loginHelpBtn">Need help signing in?</button>
            </div>
          </div>
        </section>

        <!-- JOIN WIZARD -->
        <section class="view" id="view-onboard"><div id="c-onboard"></div></section>

        <!-- MAIN TABS -->
        <section class="view" id="view-home"><div id="c-home"></div></section>
        <section class="view" id="view-train"><div id="c-train"></div></section>
        <section class="view" id="view-trainer"><div id="c-trainer"></div></section>
        <section class="view" id="view-club"><div id="c-club"></div></section>
        <section class="view" id="view-account"><div id="c-account"></div></section>

        <!-- SUB-VIEWS -->
        <section class="view" id="view-notifications">
          <header class="app-header">
            <button class="back" data-back="home">‹</button>
            <div class="greeting">Inbox</div><span></span>
          </header>
          <div id="c-notifs"></div>
        </section>

        <!-- NUTRITION — standalone page, reached from the Trainer tab -->
        <section class="view" id="view-nutrition">
          <header class="app-header">
            <button class="back" data-back="trainer">‹</button>
            <div class="greeting">Nutrition</div><span></span>
          </header>
          <div id="c-nutrition"></div>
        </section>

        <!-- ENTRY PASS -->
        <section class="view" id="view-pass">
          <div class="pass-wrap" id="passOk">
            <div class="identity">
              <div class="avatar" id="passAvatar">S</div>
              <div>
                <div class="member-name" id="passName">—</div>
                <div class="purpose" id="passPurpose">Scan to ENTER</div>
              </div>
            </div>
            <div class="dim small" id="gateLabel">Which gate are you at?</div>
            <div class="gate-picker" id="gatePicker"></div>
            <div class="qr-box"><canvas id="qrCanvas" width="220" height="220"></canvas></div>
            <div class="token-line" id="qrToken">—</div>
            <div class="refresh">
              <div class="bar"><div class="fill" id="qrBar"></div></div>
              <div class="dim small" id="qrSecs">refreshes in 25s</div>
            </div>
            <button class="accent-btn" id="gateBtn">Scan to enter</button>
            <button class="ghost-btn" id="closePass">Close</button>
          </div>
          <div class="pass-wrap denied" id="passDenied" hidden>
            <div class="big">⛔</div>
            <div class="denied-title">Entry not available</div>
            <div class="denied-body" id="deniedReason"></div>
            <button class="accent-btn" id="deniedCta"></button>
            <button class="ghost-btn" id="closePassDenied">Close</button>
          </div>
          <div class="faceid" id="faceid"><div class="faceid-ring"></div><div class="light">Face ID</div></div>
          <div class="gate-result" id="gateResult" hidden></div>
        </section>

        <!-- TAB BAR — Scan to Enter is one equal-width column inside the same bar -->
        <nav class="tabbar" id="tabbar">
          <button class="tab active" data-view="home">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            Home</button>
          <button class="tab" data-view="train">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
            Train</button>
          <button class="scan-fab" id="scanFab" data-action="open-pass" aria-label="Scan to enter">
            <span class="qr-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z"/></svg></span>
            QR</button>
          <button class="tab" data-view="trainer">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2"/><path d="M5 20c1.4-3.6 4-5.3 7-5.3s5.6 1.7 7 5.3"/><path d="M18.7 4.3l.8 1.7 1.8.3-1.3 1.3.3 1.8-1.6-.9-1.6.9.3-1.8-1.3-1.3 1.8-.3z"/></svg>
            Trainer</button>
          <button class="tab" data-view="club">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
            Club</button>
          <button class="tab" data-view="account">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.5-3.5 4-5 7.5-5s6 1.5 7.5 5"/></svg>
            Account</button>
        </nav>
      </div>
    </div>
  </div>
<script src="bus.js?v=3"></script>
<script src="data.js?v=4"></script>
<script src="app.js?v=33"></script>
</body>
</html>
